<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RACING GT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    position: relative;
    width: min(100vw, 480px);
    height: 100vh;
    overflow: hidden;
    background: #238b45;
}

/* CIELO */

#sky {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 20%;
    background: linear-gradient(#3da9ff, #c9edff);
}

/* PASTO */

#grass {
    position: absolute;
    top: 20%;
    left: 0;
    width: 100%;
    height: 80%;
    background: #269447;
}

/* CARRETERA */

#road {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 72%;
    height: 100%;
    background: #3b3b3b;
    overflow: hidden;
}

.road-border {
    position: absolute;
    top: 0;
    width: 7px;
    height: 100%;
    background: white;
    z-index: 5;
}

.road-border.left {
    left: 0;
}

.road-border.right {
    right: 0;
}

/* LINEAS */

.lane {
    position: absolute;
    width: 7px;
    height: 80px;
    background: white;
    border-radius: 5px;
    left: 50%;
    transform: translateX(-50%);
}

/* HUD */

#hud {
    position: absolute;
    top: 12px;
    left: 10px;
    right: 10px;
    z-index: 50;

    display: flex;
    justify-content: space-between;
    gap: 5px;
}

.hud-box {
    background: rgba(0, 0, 0, .65);
    color: white;
    padding: 8px 10px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: bold;
}

/* CARRO */

.car {
    position: absolute;
    width: 52px;
    height: 88px;
    border-radius: 12px;
    z-index: 20;
    box-shadow: 0 5px 12px rgba(0,0,0,.6);
}

/* JUGADOR */

#player {
    background: linear-gradient(
        90deg,
        #8b0000,
        #ff2424,
        #8b0000
    );
    border: 2px solid #ff7777;
}

#player .window {
    position: absolute;
    left: 9px;
    top: 12px;
    width: 30px;
    height: 25px;
    background: #4d8da5;
    border-radius: 6px;
}

.light {
    position: absolute;
    top: 5px;
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
}

.light.left {
    left: 7px;
}

.light.right {
    right: 7px;
}

/* ENEMIGOS */

.enemy {
    position: absolute;
    width: 52px;
    height: 88px;
    border-radius: 12px;
    z-index: 15;
    box-shadow: 0 5px 10px rgba(0,0,0,.6);
}

.enemy .window {
    position: absolute;
    left: 9px;
    top: 11px;
    width: 30px;
    height: 25px;
    background: #222;
    border-radius: 6px;
}

/* MONEDA */

.coin {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #ffd000;
    border: 3px solid #fff18a;
    box-shadow: 0 0 12px #ffd000;
    z-index: 18;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #805900;
    font-size: 18px;
    font-weight: bold;
}

/* CONTROLES */

#controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20px;
    z-index: 60;

    display: flex;
    justify-content: space-between;
    padding: 0 18px;
}

.control {
    width: 75px;
    height: 75px;
    border-radius: 50%;

    background: rgba(0,0,0,.65);
    border: 2px solid rgba(255,255,255,.4);

    color: white;
    font-size: 32px;
    font-weight: bold;
}

.control:active {
    transform: scale(.9);
    background: rgba(255,255,255,.3);
}

/* PANTALLAS */

.screen {
    position: absolute;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 20px;

    text-align: center;
    color: white;

    background: rgba(0,0,0,.88);
}

.screen h1 {
    font-size: 45px;
    color: #ff2929;
    text-shadow: 0 0 15px red;
}

.screen h2 {
    margin-top: 10px;
}

.screen p {
    margin-top: 12px;
    color: #ddd;
}

.start-btn {
    margin-top: 30px;
    padding: 15px 40px;

    border: none;
    border-radius: 50px;

    background: linear-gradient(#ff3b3b, #bd0000);

    color: white;
    font-size: 19px;
    font-weight: bold;

    box-shadow: 0 5px 0 #600000;
}

.start-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #600000;
}

/* CUENTA REGRESIVA */

#countdown {
    position: absolute;
    inset: 0;
    z-index: 90;

    display: none;

    align-items: center;
    justify-content: center;

    color: white;
    font-size: 90px;
    font-weight: bold;

    text-shadow: 0 0 20px red;
}

/* MENSAJE */

#message {
    position: absolute;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 70;

    color: white;
    font-size: 20px;
    font-weight: bold;

    text-shadow: 2px 2px 4px black;

    opacity: 0;
}

/* ESCRITORIO */

@media (min-width: 600px) {
    #game {
        height: 900px;
        border-radius: 15px;
        box-shadow: 0 0 40px rgba(0,0,0,.8);
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="sky"></div>
    <div id="grass"></div>

    <div id="road">

        <div class="road-border left"></div>
        <div class="road-border right"></div>

    </div>

    <!-- HUD -->

    <div id="hud">

        <div class="hud-box">
            🏆 <span id="score">0</span>
        </div>

        <div class="hud-box">
            🪙 <span id="coins">0</span>
        </div>

        <div class="hud-box">
            ❤️ <span id="lives">3</span>
        </div>

        <div class="hud-box">
            🚀 <span id="speed">1</span>
        </div>

    </div>

    <div id="message"></div>

    <!-- JUGADOR -->

    <div id="player" class="car">

        <div class="window"></div>

        <div class="light left"></div>
        <div class="light right"></div>

    </div>

    <!-- CONTROLES -->

    <div id="controls">

        <button
            class="control"
            id="leftBtn">
            ◀
        </button>

        <button
            class="control"
            id="rightBtn">
            ▶
        </button>

    </div>

    <!-- CUENTA REGRESIVA -->

    <div id="countdown"></div>

    <!-- INICIO -->

    <div id="startScreen" class="screen">

        <h1>RACING GT</h1>

        <h2>🏎️ TURBO RACE</h2>

        <p>
            Esquiva los carros.
        </p>

        <p>
            Recoge monedas y consigue
            la mayor puntuación.
        </p>

        <p>
            📱 Usa los botones
            o las flechas ← →
        </p>

        <button
            class="start-btn"
            id="startBtn">
            🏁 COMENZAR
        </button>

    </div>

    <!-- GAME OVER -->

    <div
        id="gameOver"
        class="screen"
        style="display:none;">

        <h1>GAME OVER</h1>

        <h2>🏁 Carrera terminada</h2>

        <p>
            Puntuación:
            <strong id="finalScore">0</strong>
        </p>

        <p>
            🏆 Récord:
            <strong id="bestScore">0</strong>
        </p>

        <p>
            🪙 Monedas:
            <strong id="finalCoins">0</strong>
        </p>

        <button
            class="start-btn"
            id="restartBtn">
            🔄 JUGAR DE NUEVO
        </button>

    </div>

</div>

<script>

const game = document.getElementById("game");
const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreElement =
    document.getElementById("score");

const coinsElement =
    document.getElementById("coins");

const livesElement =
    document.getElementById("lives");

const speedElement =
    document.getElementById("speed");

const startScreen =
    document.getElementById("startScreen");

const gameOverScreen =
    document.getElementById("gameOver");

const startButton =
    document.getElementById("startBtn");

const restartButton =
    document.getElementById("restartBtn");

const countdown =
    document.getElementById("countdown");

const finalScore =
    document.getElementById("finalScore");

const finalCoins =
    document.getElementById("finalCoins");

const bestScore =
    document.getElementById("bestScore");

const message =
    document.getElementById("message");

const leftButton =
    document.getElementById("leftBtn");

const rightButton =
    document.getElementById("rightBtn");


/* VARIABLES */

let running = false;

let playerX = 0;

let score = 0;
let coins = 0;
let lives = 3;

let speed = 5;

let enemies = [];
let coinList = [];
let lanes = [];

let enemyTimer = 0;
let coinTimer = 0;

let leftPressed = false;
let rightPressed = false;

let lastTime = 0;

let animationFrame = null;

let best =
    Number(localStorage.getItem("racingGTBest")) || 0;


/* CREAR LINEAS */

function createLanes() {

    for (let i = 0; i < 12; i++) {

        const line =
            document.createElement("div");

        line.className = "lane";

        line.style.top =
            (i * 100 - 100) + "px";

        road.appendChild(line);

        lanes.push({
            element: line,
            y: i * 100 - 100
        });
    }
}


/* POSICIONAR JUGADOR */

function resetPlayer() {

    playerX =
        (road.clientWidth -
        player.offsetWidth) / 2;

    player.style.left =
        playerX + "px";

    player.style.bottom =
        "80px";
}


/* INICIAR */

function startGame() {

    startScreen.style.display =
        "none";

    gameOverScreen.style.display =
        "none";

    score = 0;
    coins = 0;
    lives = 3;

    speed = 5;

    enemyTimer = 0;
    coinTimer = 0;

    enemies = [];
    coinList = [];

    document
        .querySelectorAll(".enemy")
        .forEach(element => element.remove());

    document
        .querySelectorAll(".coin")
        .forEach(element => element.remove());

    resetPlayer();

    updateHUD();

    countdown.style.display =
        "flex";

    let number = 3;

    countdown.textContent =
        number;

    const timer =
        setInterval(function() {

            number--;

            if (number > 0) {

                countdown.textContent =
                    number;

            } else if (number === 0) {

                countdown.textContent =
                    "GO!";

            } else {

                clearInterval(timer);

                countdown.style.display =
                    "none";

                running = true;

                lastTime =
                    performance.now();

                animationFrame =
                    requestAnimationFrame(gameLoop);
            }

        }, 700);
}


/* GAME LOOP */

function gameLoop(time) {

    if (!running) {
        return;
    }

    const delta =
        Math.min(
            (time - lastTime) / 16.67,
            2
        );

    lastTime = time;

    movePlayer(delta);
    moveLanes(delta);
    createEnemies(delta);
    moveEnemies(delta);
    createCoins(delta);
    moveCoins(delta);
    increaseDifficulty(delta);

    score += 0.08 * delta;

    updateHUD();

    animationFrame =
        requestAnimationFrame(gameLoop);
}


/* MOVER JUGADOR */

function movePlayer(delta) {

    const movement =
        7 * delta;

    if (leftPressed) {
        playerX -= movement;
    }

    if (rightPressed) {
        playerX += movement;
    }

    const maxX =
        road.clientWidth -
        player.offsetWidth -
        8;

    if (playerX < 8) {
        playerX = 8;
    }

    if (playerX > maxX) {
        playerX = maxX;
    }

    player.style.left =
        playerX + "px";
}


/* MOVER LINEAS */

function moveLanes(delta) {

    const roadSpeed =
        5 + speed * .55;

    lanes.forEach(function(lane) {

        lane.y +=
            roadSpeed * delta;

        if (lane.y >
            game.clientHeight) {

            lane.y = -100;
        }

        lane.element.style.top =
            lane.y + "px";
    });
}


/* CREAR ENEMIGO */

function createEnemies(delta) {

    enemyTimer += delta;

    const interval =
        Math.max(
            35,
            80 - speed * 3
        );

    if (enemyTimer < interval) {
        return;
    }

    enemyTimer = 0;

    const enemy =
        document.createElement("div");

    enemy.className =
        "enemy";

    const colors = [
        "linear-gradient(90deg,#111,#555,#111)",
        "linear-gradient(90deg,#0066aa,#22aaff,#0066aa)",
        "linear-gradient(90deg,#ddd,#fff,#999)",
        "linear-gradient(90deg,#6500aa,#b000ff,#6500aa)",
        "linear-gradient(90deg,#006b35,#00aa55,#006b35)",
        "linear-gradient(90deg,#ff6600,#ffaa00,#cc4400)"
    ];

    enemy.style.background =
        colors[
            Math.floor(
                Math.random() * colors.length
            )
        ];

    const windowElement =
        document.createElement("div");

    windowElement.className =
        "window";

    enemy.appendChild(
        windowElement
    );

    const maxX =
        road.clientWidth -
        52 -
        15;

    const x =
        10 +
        Math.random() *
        Math.max(10, maxX - 10);

    enemy.style.left =
        x + "px";

    enemy.style.top =
        "-100px";

    road.appendChild(enemy);

    enemies.push({
        element: enemy,
        x: x,
        y: -100
    });
}


/* MOVER ENEMIGOS */

function moveEnemies(delta) {

    const roadSpeed =
        5 + speed * .55;

    const playerRect =
        player.getBoundingClientRect();

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];

        enemy.y +=
            roadSpeed * delta;

        enemy.element.style.top =
            enemy.y + "px";

        const enemyRect =
            enemy.element.getBoundingClientRect();

        if (
            collision(
                playerRect,
                enemyRect
            )
        ) {

            enemy.element.remove();

            enemies.splice(i, 1);

            loseLife();

            continue;
        }

        if (
            enemy.y >
            game.clientHeight + 100
        ) {

            enemy.element.remove();

            enemies.splice(i, 1);

            score += 10;
        }
    }
}


/* CREAR MONEDAS */

function createCoins(delta) {

    coinTimer += delta;

    if (coinTimer < 90) {
        return;
    }

    coinTimer = 0;

    const coin =
        document.createElement("div");

    coin.className =
        "coin";

    coin.textContent =
        "$";

    const maxX =
        road.clientWidth -
        30 -
        15;

    const x =
        10 +
        Math.random() *
        Math.max(10, maxX - 10);

    coin.style.left =
        x + "px";

    coin.style.top =
        "-40px";

    road.appendChild(coin);

    coinList.push({
        element: coin,
        x: x,
        y: -40
    });
}


/* MOVER MONEDAS */

function moveCoins(delta) {

    const roadSpeed =
        5 + speed * .55;

    const playerRect =
        player.getBoundingClientRect();

    for (
        let i = coinList.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coinList[i];

        coin.y +=
            roadSpeed * delta;

        coin.element.style.top =
            coin.y + "px";

        const coinRect =
            coin.element.getBoundingClientRect();

        if (
            collision(
                playerRect,
                coinRect
            )
        ) {

            coin.element.remove();

            coinList.splice(i, 1);

            coins++;

            score += 50;

            showMessage("🪙 +50");

            continue;
        }

        if (
            coin.y >
            game.clientHeight + 50
        ) {

            coin.element.remove();

            coinList.splice(i, 1);
        }
    }
}


/* COLISION */

function collision(a, b) {

    const margin = 8;

    return !(
        a.right - margin < b.left + margin ||
        a.left + margin > b.right - margin ||
        a.bottom - margin < b.top + margin ||
        a.top + margin > b.bottom - margin
    );
}


/* PERDER VIDA */

function loseLife() {

    lives--;

    player.style.transform =
        "translateX(6px)";

    setTimeout(function() {

        player.style.transform =
            "translateX(-6px)";

    }, 60);

    setTimeout(function() {

        player.style.transform =
            "translateX(0)";

    }, 120);

    if (lives <= 0) {

        endGame();

    } else {

        showMessage("💥 ¡CHOQUE!");
    }

    updateHUD();
}


/* DIFICULTAD */

function increaseDifficulty(delta) {

    speed +=
        0.0025 * delta;

    if (speed > 18) {
        speed = 18;
    }
}


/* HUD */

function updateHUD() {

    scoreElement.textContent =
        Math.floor(score);

    coinsElement.textContent =
        coins;

    livesElement.textContent =
        lives;

    speedElement.textContent =
        Math.floor(speed);
}


/* MENSAJE */

let messageTimeout;

function showMessage(text) {

    message.textContent =
        text;

    message.style.opacity =
        "1";

    clearTimeout(
        messageTimeout
    );

    messageTimeout =
        setTimeout(function() {

            message.style.opacity =
                "0";

        }, 700);
}


/* GAME OVER */

function endGame() {

    running = false;

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );
    }

    const result =
        Math.floor(score);

    if (result > best) {

        best = result;

        localStorage.setItem(
            "racingGTBest",
            best
        );
    }

    finalScore.textContent =
        result;

    finalCoins.textContent =
        coins;

    bestScore.textContent =
        best;

    gameOverScreen.style.display =
        "flex";
}


/* TECLADO */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft"
        ) {

            leftPressed = true;

            event.preventDefault();
        }

        if (
            event.key === "ArrowRight"
        ) {

            rightPressed = true;

            event.preventDefault();
        }
    }
);

document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "ArrowLeft"
        ) {

            leftPressed = false;
        }

        if (
            event.key === "ArrowRight"
        ) {

            rightPressed = false;
        }
    }
);


/* BOTON IZQUIERDO */

leftButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        leftPressed = true;
    },
    { passive: false }
);

leftButton.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        leftPressed = false;
    },
    { passive: false }
);


/* BOTON DERECHO */

rightButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        rightPressed = true;
    },
    { passive: false }
);

rightButton.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        rightPressed = false;
    },
    { passive: false }
);


/* MOUSE */

leftButton.addEventListener(
    "mousedown",
    function() {
        leftPressed = true;
    }
);

leftButton.addEventListener(
    "mouseup",
    function() {
        leftPressed = false;
    }
);

leftButton.addEventListener(
    "mouseleave",
    function() {
        leftPressed = false;
    }
);

rightButton.addEventListener(
    "mousedown",
    function() {
        rightPressed = true;
    }
);

rightButton.addEventListener(
    "mouseup",
    function() {
        rightPressed = false;
    }
);

rightButton.addEventListener(
    "mouseleave",
    function() {
        rightPressed = false;
    }
);


/* BOTONES */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);


/* INICIO */

createLanes();

resetPlayer();

bestScore.textContent =
    best;

</script>

</body>
</html>
